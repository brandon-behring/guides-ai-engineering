# Cloudflare Workers (static assets) config — guides-ai-engineering.
#
# Deployed via Workers Builds (Git-connected). Converted from a Pages config
# 2026-06-11: Cloudflare's dashboard no longer offers Pages project creation on
# this account (Workers-only flow), so the launch uses Workers static assets.
# Proxied from the hub at guides.brandon-behring.dev/ai-engineering/* in Phase L1.
#
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy   (Workers Builds default)
#   Node version:   22 (auto-detected by Workers Builds; Astro 6 requires >=22.12.0)
#
# Standalone serving of the base=/ai-engineering/ build is handled by
# public/_redirects (302 root redirect + 200 rewrite of /ai-engineering/* onto
# the dist-root asset paths).

name = "guides-ai-engineering"
compatibility_date = "2026-06-03"

[assets]
directory = "./dist"
