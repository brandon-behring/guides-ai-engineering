[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guides-ai-engineering-companion"
version = "0.1.0"
description = "Build-your-own companion library for the AI Engineering guides (mini_eval, mini_rag, ...). For learning, not production; bridges to eval-toolkit / RAGAS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brandon Behring" }]
keywords = ["evaluation", "llm", "interview-prep", "pedagogy"]
dependencies = []  # stdlib-only by design — you should be able to read every line

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_eval", "src/mini_rag", "src/mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
